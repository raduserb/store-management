version: '3.8'

services:
  # CONFIG 1: API WITH H2
  api-h2:
    build: .
    image: store-management-api:latest
    container_name: spring-api-h2
    profiles:
      - "h2"
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=h2

  # CONFIG 2: API + SQL SERVER DB
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-db
    profiles:
      - "mssql"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuperSecret123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "SuperSecret123!", "-C", "-Q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-mssql:
    build: .
    image: store-management-api:latest
    container_name: spring-api-mssql
    profiles:
      - "mssql"
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mssql
      - DB_HOST=sqlserver
    depends_on:
      sqlserver:
        condition: service_healthy